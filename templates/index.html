{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Media Post</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen p-4">
    <!-- Header with Create Post Button -->
    <div class="max-w-md w-full mx-auto mb-4">
        <div class="bg-white rounded-lg shadow-lg p-4 flex items-center justify-between">
            <h1 class="text-xl font-bold">Feed</h1>
            <a href="create/" class="bg-blue-500 hover:bg-blue-600 text-white font-semibold px-4 py-2 rounded-lg transition flex items-center space-x-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                <span>Create Post</span>
            </a>
        </div>
    </div>

    <!-- Posts Container -->
    <div class="max-w-md w-full mx-auto space-y-4">
        {% for post in posts %}
        <div class="bg-white rounded-lg shadow-lg overflow-hidden">
            <!-- Post Image -->
            <img src="{{ post.image.url }}" alt="" class="w-full">

            <!-- Action Buttons -->
            <div class="p-4 flex items-center space-x-4">
                <!-- Like Button -->
                <button id="likeBtn-{{ post.id }}" class="flex items-center space-x-1 hover:opacity-70 transition">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 
                    4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 
                    4.5 0 00-6.364 0z">
                        </path>
                    </svg>
                    <span id="likeCount-{{ post.id }}" class="font-semibold text-sm">{{ post.like_count}}</span>
                </button>

                <!-- Comment Button -->
                <button class="flex items-center space-x-1 hover:opacity-70 transition">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 
                    8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 
                    15.042 3 13.574 3 12c0-4.418 4.03-8 
                    9-8s9 3.582 9 8z">
                        </path>
                    </svg>
                    <span id="commentCount-{{ post.id }}" class="font-semibold text-sm">{{ post.comment_count}}</span>
                </button>

                <!-- Share Button -->
                <button class="hover:opacity-70 transition ml-auto">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 
                    2.684a3 3 0 110-2.684m0 2.684l6.632 
                    3.316m-6.632-6l6.632-3.316m0 0a3 
                    3 0 105.367-2.684 3 3 0 00-5.367 
                    2.684zm0 9.316a3 3 0 105.368 
                    2.684 3 3 0 00-5.368-2.684z">
                        </path>
                    </svg>
                </button>
            </div>

            <!-- Caption -->
            <div class="px-4 pb-2">
                <p class="text-sm">
                    <span class="ml-1">{{ post.caption }}</span>
                </p>
                <p class="text-xs text-gray-500">{{ post.created_at }}</p>
            </div>

            <!-- Add Comment -->
            <div class="px-4 pb-4 pt-2 border-t">
                <div class="flex items-center space-x-2">
                    <input type="text" placeholder="Add a comment..." class="flex-1 text-sm outline-none">
                    <button class="text-blue-500 font-semibold text-sm">Post</button>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>

    <script>
        // Handle like functionality for each post
        document.querySelectorAll('[id^="likeBtn-"]').forEach(button => {
            const postId = button.id.split('-')[1];
            const likeCountElement = document.getElementById(`likeCount-${postId}`);
            let likes = parseInt(likeCountElement.textContent);
            let isLiked = false;

            button.addEventListener('click', function () {
                if (isLiked) {
                    likes--;
                    button.innerHTML = `
                        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
                        </svg>
                        <span id="likeCount-${postId}" class="font-semibold text-sm">${likes.toLocaleString()}</span>
                    `;
                } else {
                    likes++;
                    button.innerHTML = `
                        <svg class="w-7 h-7 text-red-500" fill="currentColor" viewBox="0 0 24 24">
                            <path d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
                        </svg>
                        <span id="likeCount-${postId}" class="font-semibold text-sm">${likes.toLocaleString()}</span>
                    `;
                }
                isLiked = !isLiked;
            });
        });
    </script>
</body>

</html>
