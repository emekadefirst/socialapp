{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Post</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen p-4">
    <!-- Header -->
    <div class="max-w-4xl w-full mx-auto mb-6">
        <div class="flex items-center justify-between">
            <a href="#" class="flex items-center space-x-2 text-gray-600 hover:text-gray-800">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
                <span class="font-semibold">Back to Feed</span>
            </a>
            <h1 class="text-2xl font-bold">Create New Post</h1>
            <div class="w-24"></div>
        </div>
    </div>

    <div class="max-w-4xl w-full mx-auto">
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            <!-- Form Section -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-xl font-semibold mb-4">Post Details</h2>
                
                <form id="postForm" method="POST" enctype="multipart/form-data" action="{% url 'create_post' %}">
                    {% csrf_token %}
                    
                    <!-- Image Upload -->
                    <div class="mb-6">
                        <label class="block text-sm font-semibold mb-2">Upload Image</label>
                        <div class="border-2 border-dashed border-gray-300 rounded-lg p-6 text-center hover:border-blue-500 transition cursor-pointer">
                            <input type="file" id="imageInput" name="image" accept="image/*" class="hidden" required>
                            <label for="imageInput" class="cursor-pointer">
                                <svg class="w-12 h-12 mx-auto text-gray-400 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                                </svg>
                                <p class="text-sm text-gray-600">Click to upload an image</p>
                                <p class="text-xs text-gray-400 mt-1">PNG, JPG, GIF up to 10MB</p>
                            </label>
                        </div>
                        <p id="fileName" class="text-sm text-gray-600 mt-2 hidden"></p>
                    </div>

                    <!-- Caption -->
                    <div class="mb-6">
                        <label for="caption" class="block text-sm font-semibold mb-2">Caption</label>
                        <textarea 
                            id="caption" 
                            name="caption" 
                            rows="6" 
                            placeholder="Write a caption..."
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none"
                            required
                        ></textarea>
                        <p class="text-xs text-gray-400 mt-1"><span id="charCount">0</span> characters</p>
                    </div>

                    <!-- Submit Button -->
                    <button 
                        type="submit" 
                        class="w-full bg-blue-500 hover:bg-blue-600 text-white font-semibold py-3 rounded-lg transition"
                    >
                        Create Post
                    </button>
                </form>
            </div>

            <!-- Preview Section -->
            <div class="bg-white rounded-lg shadow-lg p-6">
                <h2 class="text-xl font-semibold mb-4">Preview</h2>
                
                <div id="previewContainer" class="bg-gray-50 rounded-lg border-2 border-gray-200">
                    <!-- Post Preview -->
                    <div class="bg-white rounded-lg shadow overflow-hidden">
                        <!-- Post Image Preview -->
                        <div id="imagePreview" class="w-full aspect-square bg-gray-200 flex items-center justify-center">
                            <div class="text-center text-gray-400">
                                <svg class="w-16 h-16 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                                </svg>
                                <p class="text-sm">No image selected</p>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="p-4 flex items-center space-x-4">
                            <button class="flex items-center space-x-1">
                                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"></path>
                                </svg>
                                <span class="font-semibold text-sm">0</span>
                            </button>

                            <button class="flex items-center space-x-1">
                                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path>
                                </svg>
                                <span class="font-semibold text-sm">0</span>
                            </button>

                            <button class="ml-auto">
                                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path>
                                </svg>
                            </button>
                        </div>

                        <!-- Caption Preview -->
                        <div class="px-4 pb-2">
                            <p class="text-sm">
                                <span id="captionPreview" class="text-gray-400 italic">Your caption will appear here...</span>
                            </p>
                            <p class="text-xs text-gray-500 mt-1">Just now</p>
                        </div>

                        <!-- Add Comment -->
                        <div class="px-4 pb-4 pt-2 border-t">
                            <div class="flex items-center space-x-2">
                                <input type="text" placeholder="Add a comment..." class="flex-1 text-sm outline-none" disabled>
                                <button class="text-blue-500 font-semibold text-sm">Post</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const imageInput = document.getElementById('imageInput');
        const imagePreview = document.getElementById('imagePreview');
        const fileName = document.getElementById('fileName');
        const captionInput = document.getElementById('caption');
        const captionPreview = document.getElementById('captionPreview');
        const charCount = document.getElementById('charCount');

        // Handle image upload and preview
        imageInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                // Show file name
                fileName.textContent = `Selected: ${file.name}`;
                fileName.classList.remove('hidden');

                // Create preview
                const reader = new FileReader();
                reader.onload = function(e) {
                    imagePreview.innerHTML = `<img src="${e.target.result}" alt="Preview" class="w-full h-full object-cover">`;
                };
                reader.readAsDataURL(file);
            }
        });

        // Handle caption preview and character count
        captionInput.addEventListener('input', function(e) {
            const text = e.target.value;
            charCount.textContent = text.length;
            
            if (text.trim() === '') {
                captionPreview.innerHTML = '<span class="text-gray-400 italic">Your caption will appear here...</span>';
            } else {
                captionPreview.textContent = text;
                captionPreview.classList.remove('text-gray-400', 'italic');
            }
        });

        // Optional: Drag and drop functionality
        const dropArea = imageInput.parentElement;
        
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        ['dragenter', 'dragover'].forEach(eventName => {
            dropArea.addEventListener(eventName, () => {
                dropArea.classList.add('border-blue-500', 'bg-blue-50');
            }, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropArea.addEventListener(eventName, () => {
                dropArea.classList.remove('border-blue-500', 'bg-blue-50');
            }, false);
        });

        dropArea.addEventListener('drop', function(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            imageInput.files = files;
            
            // Trigger change event
            const event = new Event('change', { bubbles: true });
            imageInput.dispatchEvent(event);
        }, false);
    </script>
</body>

</html>
